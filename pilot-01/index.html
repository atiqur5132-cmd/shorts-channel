<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b0b; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0b0b0b; }
      .scene-host { z-index: 10; }
      #captions { z-index: 30; }
      #grain {
        position: absolute; inset: 0; z-index: 40; pointer-events: none;
        background-image: url("assets/img/grain.png"); background-size: 512px 512px;
        opacity: 0.08; mix-blend-mode: overlay;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="45.4" data-width="1080" data-height="1920">
      <div id="hook" class="scene-host" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="3.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="name" class="scene-host" data-composition-id="name" data-composition-src="compositions/name.html" data-start="3.6" data-duration="1.84" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="buy" class="scene-host" data-composition-id="buy" data-composition-src="compositions/buy.html" data-start="5.44" data-duration="4.88" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="borrow" class="scene-host" data-composition-id="borrow" data-composition-src="compositions/borrow.html" data-start="10.32" data-duration="10.16" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="die" class="scene-host" data-composition-id="die" data-composition-src="compositions/die.html" data-start="20.48" data-duration="8.4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="rate" class="scene-host" data-composition-id="rate" data-composition-src="compositions/rate.html" data-start="28.88" data-duration="6.72" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="paycheck" class="scene-host" data-composition-id="paycheck" data-composition-src="compositions/paycheck.html" data-start="35.6" data-duration="4.24" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="outro" class="scene-host" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="39.84" data-duration="5.56" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="45.4" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920"></div>

      <div id="grain" class="clip" data-start="0" data-duration="45.4" data-track-index="3" data-layout-allow-overlap data-layout-ignore></div>

      <!-- voice -->
      <audio id="voice" src="assets/voice.wav" data-start="0" data-track-index="4" data-volume="1"></audio>
      <!-- music: "Tunnel Vision" by AudioWay (CC0, Freesound). It drops out under "Step three. Die." and returns on the heirs. -->
      <audio id="music" src="assets/bgm/tunnel-vision.mp3" data-start="0" data-duration="45.4" data-track-index="5" data-volume="0.09" data-fade-in="0.3" data-fade-out="1.6"
        data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:1},{&quot;t&quot;:20.3,&quot;v&quot;:1},{&quot;t&quot;:20.6,&quot;v&quot;:0.08},{&quot;t&quot;:22.1,&quot;v&quot;:0.08},{&quot;t&quot;:22.6,&quot;v&quot;:1},{&quot;t&quot;:45.4,&quot;v&quot;:1}]}]}"></audio>
      <!-- 12 effects, each caused by something on screen; peaks land one frame after the picture -->
      <audio id="sfx-legal" src="assets/sfx/pop.mp3" data-start="2.99" data-duration="0.72" data-track-index="6" data-volume="0.9"></audio>
      <audio id="sfx-buy" src="assets/sfx/impact-bass-1.mp3" data-start="4.12" data-duration="2.116" data-track-index="7" data-volume="0.15"></audio>
      <audio id="sfx-borrow" src="assets/sfx/whoosh.mp3" data-start="4.51" data-duration="0.575" data-track-index="6" data-volume="0.4"></audio>
      <audio id="sfx-die" src="assets/sfx/impact-bass-2.mp3" data-start="3.08" data-duration="2.592" data-track-index="8" data-volume="0.13"></audio>
      <audio id="sfx-nosale" src="assets/sfx/pop.mp3" data-start="8.81" data-duration="0.72" data-track-index="6" data-volume="0.9"></audio>
      <audio id="sfx-whip2" src="assets/sfx/whoosh-short.mp3" data-start="10.26" data-duration="0.575" data-track-index="6" data-volume="0.4"></audio>
      <audio id="sfx-income" src="assets/sfx/impact-bass-1.mp3" data-start="16.0" data-duration="2.116" data-track-index="7" data-volume="0.15"></audio>
      <audio id="sfx-never" src="assets/sfx/impact-bass-2.mp3" data-start="25.92" data-duration="2.592" data-track-index="8" data-volume="0.13"></audio>
      <audio id="sfx-clip" src="assets/sfx/whoosh.mp3" data-start="28.8" data-duration="0.575" data-track-index="6" data-volume="0.4"></audio>
      <audio id="sfx-rate" src="assets/sfx/pop.mp3" data-start="33.67" data-duration="0.72" data-track-index="6" data-volume="0.9"></audio>
      <audio id="sfx-whip3" src="assets/sfx/whoosh-short.mp3" data-start="35.54" data-duration="0.575" data-track-index="6" data-volume="0.4"></audio>
      <audio id="sfx-own" src="assets/sfx/impact-bass-1.mp3" data-start="43.22" data-duration="2.116" data-track-index="7" data-volume="0.15"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // film grain: the tile jumps to a new offset every 2 frames (stepped, seek-safe)
      tl.fromTo("#grain", { backgroundPosition: "0px 0px" }, { backgroundPosition: "85591px 58993px", duration: 45.4, ease: "steps(681)" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
